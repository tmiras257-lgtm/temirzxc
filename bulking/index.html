<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bulking</title>
<meta name="description" content="Трекер калорий для набора массы — без весов, по порциям столовой.">
<meta name="theme-color" content="#0B0C0F" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="bulking">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#0B0C0F; --card:#15171C; --card2:#1E2128; --line:#2A2E37;
  --text:#F3F4F6; --dim:#8D93A0; --faint:#5C6270;
  --accent:#C6F432; --accent-ink:#121505; --accent-text:#C6F432; --accent-soft:rgba(198,244,50,.12);
  --prot:#FF6B57; --carb:#FFB938; --fat:#4DA3FF; --over:#FF9F1C; --danger:#FF5A5F;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --r:20px;
  --font:'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F3F4F6; --card:#FFFFFF; --card2:#F0F1F4; --line:#E3E5EA;
    --text:#111318; --dim:#666C78; --faint:#9AA0AB;
    --accent:#B9EA1F; --accent-ink:#121505; --accent-text:#4E7A00; --accent-soft:rgba(140,190,0,.14);
    --shadow:0 10px 30px rgba(20,25,35,.10);
    color-scheme: light;
  }
}
:root[data-theme="light"]{
  --bg:#F3F4F6; --card:#FFFFFF; --card2:#F0F1F4; --line:#E3E5EA;
  --text:#111318; --dim:#666C78; --faint:#9AA0AB;
  --accent:#B9EA1F; --accent-ink:#121505; --accent-text:#4E7A00; --accent-soft:rgba(140,190,0,.14);
  --shadow:0 10px 30px rgba(20,25,35,.10);
  color-scheme: light;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font); font-size:15px; line-height:1.4;
  -webkit-font-smoothing:antialiased; overflow-x:hidden}
body.locked{overflow:hidden}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
input,select{font:inherit; color:inherit}
.wrap{max-width:520px; margin:0 auto; padding-top:calc(env(safe-area-inset-top) + 12px); padding-bottom:calc(110px + env(safe-area-inset-bottom)); padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* header */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:4px 0 14px}
.brand{font-weight:800; font-size:24px; letter-spacing:-.04em; display:flex; align-items:center; gap:8px}
.brand i{width:26px; height:26px; border-radius:8px; background:var(--accent); display:grid; place-items:center; color:var(--accent-ink); font-style:normal; font-size:16px}
.datenav{display:flex; align-items:center; gap:2px; background:var(--card); border-radius:999px; padding:4px}
.datenav button{width:32px; height:32px; border-radius:50%; display:grid; place-items:center; color:var(--dim); font-size:18px}
.datenav button:active{background:var(--card2)}
.datenav .dlabel{width:auto; padding:0 10px; border-radius:999px; font-weight:700; font-size:14px; color:var(--text); min-width:92px}

.card{background:var(--card); border-radius:var(--r); padding:16px; margin-bottom:12px}
.h2{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:22px 4px 10px}
.muted{color:var(--dim)}
.small{font-size:13px}

/* summary */
.summary{display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:center}
.ringbox{position:relative; width:156px; height:156px}
.ring{width:100%; height:100%; display:block}
.ring circle{fill:none; stroke-width:14; stroke-linecap:round}
.ring-track{stroke:var(--card2)}
.ring-fill{stroke:var(--accent); transition:stroke-dashoffset .6s ease}
.ring-over{stroke:var(--over)}
.ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center}
.ring-num{font-size:32px; font-weight:800; letter-spacing:-.04em; line-height:1}
.ring-lbl{font-size:12px; color:var(--dim); margin-top:4px}
.stats{display:flex; flex-direction:column; gap:12px}
.stat .v{font-size:20px; font-weight:800; letter-spacing:-.02em}
.stat .k{font-size:12px; color:var(--dim)}
.stat .v small{font-size:12px; color:var(--dim); font-weight:600}
@media (max-width:360px){ .ringbox{width:132px; height:132px} .ring-num{font-size:27px} }

.macros{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; padding-top:16px; border-top:1px solid var(--line)}
.macro .k{font-size:12px; color:var(--dim); display:flex; justify-content:space-between}
.macro .v{font-weight:700; font-size:14px; margin:2px 0 6px}
.macro .v small{color:var(--dim); font-weight:600}
.bar{height:6px; border-radius:6px; background:var(--card2); overflow:hidden}
.bar span{display:block; height:100%; border-radius:6px; transition:width .5s ease}

/* meals */
.meal-head{display:flex; align-items:center; justify-content:space-between; gap:10px}
.meal-title{display:flex; align-items:center; gap:10px; font-weight:800; font-size:17px}
.meal-ico{width:34px; height:34px; border-radius:11px; background:var(--card2); display:grid; place-items:center; font-size:17px}
.meal-kcal{font-weight:700; color:var(--dim); font-size:14px}
.meal-kcal b{color:var(--text)}
.entries{list-style:none; margin:10px 0 0; padding:0}
.entry{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:10px 0; border-top:1px solid var(--line)}
.entry .e-main{flex:1; min-width:0}
.e-name{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.e-sub{font-size:12px; color:var(--dim)}
.e-kcal{font-weight:700; font-size:14px}
.meal-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; height:40px; padding:0 16px; border-radius:12px; font-weight:700; font-size:14px; background:var(--card2)}
.btn:active{transform:scale(.97)}
.btn-accent{background:var(--accent); color:var(--accent-ink)}
.btn-ghost{background:transparent; color:var(--accent-text); padding:0 8px}
.btn-danger{background:transparent; color:var(--danger)}
.btn-block{width:100%; height:50px; font-size:16px; border-radius:14px}
.btn-soft{background:var(--accent-soft); color:var(--accent-text)}

.banner{background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius:var(--r); padding:14px 16px; margin-bottom:12px}
.banner p{margin:0 0 10px}
.chips{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; height:34px; padding:0 14px; border-radius:999px; background:var(--card2); font-weight:600; font-size:13px; white-space:nowrap; display:inline-flex; align-items:center; gap:6px}
.chip.on{background:var(--text); color:var(--bg)}
.chip b{font-weight:800}
.boost .chip{background:var(--card2)}

.water-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:10px}
.cups{display:grid; grid-template-columns:repeat(10,1fr); gap:5px}
.cup{height:32px; border-radius:6px 6px 9px 9px; background:var(--card2); position:relative; overflow:hidden}
.cup.on{background:var(--fat)}

/* bottom nav */
.nav{position:fixed; left:0; right:0; bottom:0; z-index:20; padding:0 12px calc(10px + env(safe-area-inset-bottom))}
.nav-in{max-width:496px; margin:0 auto; background:color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line); border-radius:24px; display:grid; grid-template-columns:1fr 1fr 76px 1fr 1fr; align-items:center; height:64px; box-shadow:var(--shadow)}
.tab{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; font-weight:700; color:var(--faint)}
.tab svg{width:22px; height:22px}
.tab.on{color:var(--text)}
.fab{width:58px; height:58px; border-radius:20px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; margin:0 auto; transform:translateY(-14px); box-shadow:0 10px 24px color-mix(in srgb, var(--accent) 40%, transparent)}
.fab svg{width:28px; height:28px}
.fab:active{transform:translateY(-14px) scale(.94)}

/* sheet */
.backdrop{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center; animation:fade .2s ease}
.sheet{background:var(--bg); width:100%; max-width:520px; max-height:92vh; max-height:92dvh; border-radius:26px 26px 0 0; display:flex; flex-direction:column; animation:up .28s cubic-bezier(.2,.9,.3,1); overflow:hidden}
.grab{width:40px; height:5px; border-radius:5px; background:var(--line); margin:8px auto 0; flex:none}
.sheet-head{padding:10px 16px 8px; flex:none}
.sheet-title{display:flex; align-items:center; justify-content:space-between; font-size:20px; font-weight:800; letter-spacing:-.02em; margin-bottom:12px}
.x{width:34px; height:34px; border-radius:50%; background:var(--card2); display:grid; place-items:center; color:var(--dim); font-size:18px}
.sheet-body{flex:1; overflow-y:auto; padding:0 16px 16px; overscroll-behavior:contain}
.sheet-foot{flex:none; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--bg)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

.seg{display:grid; grid-template-columns:repeat(4,1fr); background:var(--card); border-radius:12px; padding:3px; gap:3px}
.seg button{height:34px; border-radius:9px; font-weight:700; font-size:13px; color:var(--dim)}
.seg button.on{background:var(--card2); color:var(--text)}
.search{display:flex; align-items:center; gap:8px; background:var(--card); border-radius:14px; padding:0 14px; height:46px; margin:10px 0}
.search svg{width:18px; height:18px; color:var(--faint); flex:none}
.search input{flex:1; border:0; outline:0; background:transparent; height:100%; font-size:16px; min-width:0}
.hint{font-size:12px; color:var(--dim); margin:0 2px 10px}

.foods{display:flex; flex-direction:column; gap:6px; margin-top:12px}
.food{display:flex; align-items:center; gap:12px; text-align:left; background:var(--card); border-radius:14px; padding:12px 12px 12px 14px; width:100%}
.food:active{background:var(--card2)}
.f-main{flex:1; min-width:0}
.f-name{font-weight:700; font-size:15px}
.zh{font-weight:500; color:var(--faint); font-size:13px; margin-left:4px}
.f-sub{font-size:12px; color:var(--dim); margin-top:1px}
.f-kcal{font-weight:800; text-align:right; font-size:15px; line-height:1.1}
.f-kcal small{display:block; font-size:11px; color:var(--dim); font-weight:600}
.f-plus{width:32px; height:32px; border-radius:10px; background:var(--card2); display:grid; place-items:center; font-weight:800; font-size:18px; flex:none; color:var(--accent-text)}
.f-plus.in{background:var(--accent); color:var(--accent-ink); font-size:12px}
.f-plus.fstar{color:var(--faint); font-size:16px}
.f-plus.fstar.in{color:var(--accent-ink)}
.empty{color:var(--dim); text-align:center; padding:24px 10px; font-size:14px}

.tray-lines{max-height:38vh; overflow-y:auto; margin:-4px 0 10px}
.tline{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line)}
.tline .t-name{flex:1; min-width:0; font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tline .t-k{width:52px; text-align:right; font-weight:700; font-size:14px}
.star{width:30px; height:30px; display:grid; place-items:center; color:var(--faint); font-size:17px}
.star.on{color:var(--carb)}
.stepper{display:flex; align-items:center; background:var(--card2); border-radius:10px; height:34px}
.stepper button{width:34px; height:34px; font-size:18px; font-weight:700}
.stepper span{min-width:38px; text-align:center; font-weight:800; font-size:14px}
.stepper.big{height:48px; border-radius:14px}
.stepper.big button{width:56px; height:48px; font-size:22px}
.stepper.big span{min-width:70px; font-size:20px}
.tray-bar{display:flex; gap:10px; align-items:center}
.tray-sum{flex:1; text-align:left; height:50px; border-radius:14px; background:var(--card); padding:0 14px; display:flex; align-items:center; justify-content:space-between; font-weight:700}
.tray-sum small{color:var(--dim); font-weight:600}
.tray-bar .btn{height:50px; border-radius:14px; padding:0 22px; font-size:16px}
.btn[disabled]{opacity:.4; pointer-events:none}
.qbtns{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:12px}
.qbtns button{height:38px; border-radius:10px; background:var(--card); font-weight:700; font-size:14px}
.qbtns button.on{background:var(--text); color:var(--bg)}

.nutri{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:14px 0}
.nutri div{background:var(--card); border-radius:12px; padding:10px; text-align:center}
.nutri b{display:block; font-size:18px; font-weight:800}
.nutri span{font-size:11px; color:var(--dim)}

/* forms */
.field{display:block; margin-bottom:12px}
.field > span{display:block; font-size:12px; font-weight:700; color:var(--dim); margin:0 2px 6px}
.input, .select{width:100%; height:48px; border-radius:12px; border:1px solid var(--line); background:var(--card); padding:0 14px; font-size:16px; outline:0; appearance:none; -webkit-appearance:none}
.select{background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%); background-position:calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size:5px 5px; background-repeat:no-repeat; padding-right:36px}
.input:focus, .select:focus{border-color:var(--accent-text)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.check{display:flex; align-items:center; gap:10px; font-weight:600; margin:4px 0 14px}
.check input{width:20px; height:20px; accent-color:var(--accent)}
.sex{display:grid; grid-template-columns:1fr 1fr; gap:6px; background:var(--card); border-radius:12px; padding:3px; border:1px solid var(--line)}
.sex button{height:40px; border-radius:9px; font-weight:700; color:var(--dim)}
.sex button.on{background:var(--card2); color:var(--text)}

.kv{display:flex; justify-content:space-between; padding:9px 0; border-top:1px solid var(--line); font-size:14px}
.kv:first-child{border-top:0}
.kv b{font-weight:800}
.big-target{display:flex; align-items:baseline; gap:8px; margin:2px 0 10px}
.big-target b{font-size:40px; font-weight:800; letter-spacing:-.04em; color:var(--accent-text)}

/* progress */
.chart{width:100%; height:auto; display:block}
.chart text{fill:var(--faint); font-size:10px; font-family:var(--font)}
.chart .grid{stroke:var(--line); stroke-width:1}
.chart .goal{stroke:var(--text); stroke-width:1.2; stroke-dasharray:4 4; opacity:.5}
.chart .wline{fill:none; stroke:var(--accent-text); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round}
.chart .wdot{fill:var(--bg); stroke:var(--accent-text); stroke-width:2}
.chart .barhit{fill:var(--accent)}
.chart .barlow{fill:var(--faint); opacity:.55}
.chart .barnone{fill:var(--card2)}
.kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.kpi{background:var(--card); border-radius:16px; padding:12px}
.kpi b{display:block; font-size:20px; font-weight:800; letter-spacing:-.02em}
.kpi span{font-size:11px; color:var(--dim); font-weight:600}
.wlog{display:flex; gap:8px}
.wlog .input{flex:1}
.wrow{display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-top:1px solid var(--line); font-size:14px}
.wrow button{color:var(--faint); width:28px; height:28px}
.advice{border-radius:16px; padding:14px; background:var(--card2); margin-top:12px; font-size:14px}
.advice b{display:block; margin-bottom:4px}

.toast{position:fixed; left:50%; bottom:calc(92px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:80; background:var(--text); color:var(--bg); border-radius:14px; padding:12px 14px 12px 16px; display:flex; gap:14px; align-items:center; font-weight:600; font-size:14px; box-shadow:var(--shadow); max-width:calc(100vw - 32px); animation:fade .2s ease}
.toast button{color:var(--accent-text); font-weight:800; filter:brightness(.8)}
:root:not([data-theme="light"]) .toast button{color:#4E7A00}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .toast button{color:var(--accent)} }
[hidden]{display:none !important}
.add-tools{display:grid; grid-template-columns:1.3fr 1fr; gap:8px; margin:4px 0 10px}
.tool{height:48px; border-radius:14px; background:var(--card); font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; gap:8px}
.tool.main{background:var(--accent); color:var(--accent-ink)}
.tool svg{width:20px; height:20px}
.note{background:var(--accent-soft); border-radius:14px; padding:12px 14px; font-size:13px; margin-top:6px}
.note b{display:block; font-size:14px; margin-bottom:2px}
.photo-prev{width:100%; max-height:42vh; object-fit:cover; border-radius:18px; display:block; background:var(--card)}
.thinking{display:flex; align-items:center; gap:12px; margin:16px 2px; font-weight:700}
.spin{width:22px; height:22px; border-radius:50%; border:3px solid var(--card2); border-top-color:var(--accent-text); animation:rot .8s linear infinite; flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .spin{animation-duration:2.4s} .sheet,.backdrop,.toast{animation:none} }
.hand{display:grid; grid-template-columns:44px 1fr; gap:12px; align-items:start; background:var(--card); border-radius:16px; padding:14px; margin-bottom:8px}
.hand .em{font-size:30px; line-height:1; text-align:center}
.hand b{display:block; font-size:15px}
.hand .eq{font-size:13px; color:var(--dim); margin-top:2px}
.hand .x1{display:inline-block; margin-top:6px; font-size:12px; font-weight:800; background:var(--accent-soft); color:var(--accent-text); border-radius:8px; padding:3px 8px}
.ltable{width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums}
.ltable td{padding:9px 0; border-top:1px solid var(--line)}
.ltable td:last-child{text-align:right; font-weight:800}
.sync{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--dim)}
.sync i{width:8px; height:8px; border-radius:50%; background:var(--faint)}
.sync.ok i{background:var(--accent-text)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<nav class="nav" aria-label="Навигация">
  <div class="nav-in">
    <button class="tab" data-act="tab" data-tab="diary" id="t-diary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Дневник
    </button>
    <button class="tab" data-act="tab" data-tab="progress" id="t-progress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Прогресс
    </button>
    <button class="fab" data-act="open-add" aria-label="Добавить еду">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tab" data-act="tab" data-tab="foods" id="t-foods">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/></svg>Блюда
    </button>
    <button class="tab" data-act="tab" data-tab="profile" id="t-profile">

function splitState(){

async function cloudFlush(){
  if(!Cloud.db) return;
  if(Cloud.busy){ Cloud.again = true; return; }
  Cloud.busy = true;
  try{
    do{
      Cloud.again = false;
      const docs = splitState();
      for(const [id, body] of Object.entries(docs)){
        const js = JSON.stringify(body);
        if(Cloud.synced[id] === js) continue;
        await Cloud.db.doc(`${Cloud.base}/${id}`).set(JSON.parse(js));
        Cloud.synced[id] = js;
      }
      for(const id of Object.keys(Cloud.synced)){
        if(!(id in docs)){ await Cloud.db.doc(`${Cloud.base}/${id}`).delete(); delete Cloud.synced[id]; }
      }
    }while(Cloud.again);
    Cloud.status = 'synced';
  }catch(e){
    Cloud.status = 'error';
    if(e && e.code === 'quota_exceeded') toast('Облако заполнено — скачай копию в профиле');
  }finally{ Cloud.busy = false; }
}

function ring(eaten, goal){
  const R = 78, C = 2 * Math.PI * R;
  const pct = goal ? eaten / goal : 0;
  const main = Math.min(pct, 1), over = Math.max(0, Math.min(pct - 1, 1));
  return `<svg viewBox="0 0 180 180" class="ring" aria-hidden="true">
    <circle cx="90" cy="90" r="${R}" class="ring-track"/>
    <circle cx="90" cy="90" r="${R}" class="ring-fill" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - main)}" transform="rotate(-90 90 90)"/>
    ${over > 0 ? `<circle cx="90" cy="90" r="${R}" class="ring-over" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - over)}" transform="rotate(-90 90 90)"/>` : ''}
  </svg>`;
}
function macroBar(label, val, goal, color){
  const w = goal ? Math.min(100, val / goal * 100) : 0;
  return `<div class="macro"><div class="k"><span>${label}</span><span>${goal ? Math.round(val / goal * 100) : 0}%</span></div>
    <div class="v">${Math.round(val)}<small> / ${goal} г</small></div>
    <div class="bar"><span style="width:${w}%;background:${color}"></span></div></div>`;
}

          <div class="e-kcal">${fmt(e.kcal * e.qty)}</div></button></li>`).join('')}</ul>` : ''}
      <div class="meal-actions">
        <button class="btn btn-soft" data-act="open-add" data-meal="${m.id}">＋ Добавить</button>
        ${!list.length && yList.length ? `<button class="btn" data-act="copy-yday" data-meal="${m.id}">↻ Как вчера · ${fmt(sumUp(yList).kcal)}</button>` : ''}
      </div></section>`;
  }

  const w = day.water || 0;
  html += `<section class="card"><div class="water-head"><div style="font-weight:800">Вода</div><div class="small muted">${(w * 0.25).toString().replace('.', ',')} л из 2,5 л · стакан 250 мл</div></div>

  return html;
}

/* ---------- progress ---------- */
function weightChart(ws){
  if(ws.length < 2) return `<div class="empty">Взвесься ещё хотя бы раз — появится график.</div>`;
  const pts = ws.slice(-60);
  const W = 340, H = 160, L = 34, R = 10, T = 12, B = 24;
  const t0 = parseKey(pts[0].date).getTime(), t1 = parseKey(pts[pts.length - 1].date).getTime();
  const span = Math.max(t1 - t0, 864e5);
  let mn = Math.min(...pts.map(p => p.kg)), mx = Math.max(...pts.map(p => p.kg));
  mn = Math.floor(mn - 0.5); mx = Math.ceil(mx + 0.5);
  const x = d => L + (parseKey(d).getTime() - t0) / span * (W - L - R);
  const y = kg => T + (mx - kg) / (mx - mn) * (H - T - B);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.date).toFixed(1)},${y(p.kg).toFixed(1)}`).join(' ');
  const ticks = [mn, (mn + mx) / 2, mx];
  const lab = k => { const d = parseKey(k); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График веса">
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${(Math.round(v * 10) / 10).toString().replace('.', ',')}</text>`).join('')}
    <path class="wline" d="${line}"/>
    ${pts.map((p, i) => `<circle class="wdot" cx="${x(p.date)}" cy="${y(p.kg)}" r="${i === pts.length - 1 ? 4.5 : 3}"/>`).join('')}
    <text x="${L}" y="${H - 6}">${lab(pts[0].date)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${lab(pts[pts.length - 1].date)}</text>
  </svg>`;
}
function calChart(goal){
  const days = 14, end = todayKey();
  const data = Array.from({length:days}, (_, i) => { const k = addDays(end, i - days + 1); return {k, kcal:sumUp(getDay(k).entries).kcal}; });
  const W = 340, H = 160, L = 6, R = 6, T = 12, B = 22;
  const mx = Math.max(goal * 1.25, ...data.map(d => d.kcal));
  const bw = (W - L - R) / days;
  const y = v => T + (1 - v / mx) * (H - T - B);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Калории за 14 дней">
    ${data.map((d, i) => { const h = d.kcal ? Math.max(3, (H - T - B) - (y(d.kcal) - T)) : 3; const cls = !d.kcal ? 'barnone' : d.kcal >= goal * 0.9 ? 'barhit' : 'barlow';
      return `<rect class="${cls}" x="${L + i * bw + 3}" y="${H - B - h}" width="${bw - 6}" height="${h}" rx="4"/><text x="${L + i * bw + bw / 2}" y="${H - 7}" text-anchor="middle">${parseKey(d.k).getDate()}</text>`; }).join('')}
    <line class="goal" x1="${L}" x2="${W - R}" y1="${y(goal)}" y2="${y(goal)}"/>
    <text x="${W - R}" y="${y(goal) - 5}" text-anchor="end">цель ${fmt(goal)}</text>
  </svg>`;
}
function weeklyRate(){
  const end = parseKey(todayKey()).getTime();
  const pts = S.weights.filter(w => end - parseKey(w.date).getTime() <= 21 * 864e5);
  if(pts.length < 4) return null;
  const xs = pts.map(w => (parseKey(w.date).getTime() - end) / 864e5), ys = pts.map(w => w.kg);
  if(Math.max(...xs) - Math.min(...xs) < 7) return null;
  const mx = xs.reduce((a, b) => a + b) / xs.length, my = ys.reduce((a, b) => a + b) / ys.length;
  let nu = 0, de = 0; xs.forEach((x, i) => { nu += (x - mx) * (ys[i] - my); de += (x - mx) ** 2; });
  return de ? nu / de * 7 : null;
}
function renderProgress(){
  const t = targets();
  const ws = [...S.weights].sort((a, b) => a.date.localeCompare(b.date));
  const cur = ws.length ? ws[ws.length - 1].kg : S.profile.weight;
  const first = ws.length ? ws[0].kg : cur;
  const diff = cur - first;
  // stats for last 7 days
  const last7 = Array.from({length:7}, (_, i) => getDay(addDays(todayKey(), -i))).filter(d => d.entries.length);
  const avgK = last7.length ? last7.reduce((s, d) => s + sumUp(d.entries).kcal, 0) / last7.length : 0;
  const avgP = last7.length ? last7.reduce((s, d) => s + sumUp(d.entries).p, 0) / last7.length : 0;
  let streak = 0, k = todayKey();
  if(!getDay(k).entries.length) k = addDays(k, -1);
  while(getDay(k).entries.length){ streak++; k = addDays(k, -1); }

  const rate = weeklyRate();
  const want = S.profile.surplus / 7700 * 7;
  let advice;
  if(rate === null){
    advice = `<b>Как понять, что всё работает</b>Взвешивайся 3–4 раза в неделю утром, после туалета и до еды. Через 1–2 недели я посчитаю твой реальный темп и подскажу, менять ли калории.`;
  }else if(rate < 0.1){
    advice = `<b>Вес почти стоит: ${rate >= 0 ? '+' : ''}${rate.toFixed(2).replace('.', ',')} кг/нед</b>Для набора этого мало — скорее всего, в столовой порции меньше, чем кажется. Добавь ~200 ккал в день.
      <div style="margin-top:10px"><button class="btn btn-accent" data-act="adapt" data-d="200">Поднять норму на 200</button></div>`;
  }else if(rate > Math.max(0.6, want + 0.25)){
    advice = `<b>Слишком быстро: +${rate.toFixed(2).replace('.', ',')} кг/нед</b>Так вместе с мышцами копится лишний жир. Срежь ~200 ккал в день.
      <div style="margin-top:10px"><button class="btn" data-act="adapt" data-d="-200">Снизить норму на 200</button></div>`;
  }else{
    advice = `<b>Темп отличный: +${rate.toFixed(2).replace('.', ',')} кг/нед</b>Это хороший набор без лишнего жира. Продолжай в том же духе 💪`;
  }

  return header() + `
    <div class="kpis">
      <div class="kpi"><b>${cur.toString().replace('.', ',')}</b><span>вес, кг</span></div>
      <div class="kpi"><b style="color:${diff >= 0 ? 'var(--accent-text)' : 'var(--danger)'}">${diff >= 0 ? '+' : ''}${(Math.round(diff * 10) / 10).toString().replace('.', ',')}</b><span>с начала, кг</span></div>
      <div class="kpi"><b>${streak}</b><span>дней подряд 🔥</span></div>
    </div>
    <div class="h2">Вес</div>
    <section class="card">
      <div class="wlog"><input class="input" id="wInput" inputmode="decimal" placeholder="Вес сегодня, кг" value=""><button class="btn btn-accent" style="height:48px" data-act="weight-log">Записать</button></div>
      <div style="margin-top:14px">${weightChart(ws)}</div>
      <div class="advice">${advice}</div>

function photoPrompt(){
  const list = allFoods().map(f => `${f.id} | ${f.name} | ${f.zh || ''} | ${f.portion || 'порция'} | ${f.kcal} kcal, P${f.p} C${f.c} F${f.f}`).join('\n');
  return `You estimate food for a student who is bulking and eats in a Chinese university canteen (食堂). The attached photo shows what they took (a tray, plate, bowl or packaged food). Identify every distinct food and drink and estimate how much of each there is.

Reference list of canteen dishes with their standard portion (id | name | 汉字 | standard portion | nutrition per ONE standard portion):
${list}

Rules:
- If an item matches a dish in the list, use its id and set qty = how many standard portions are on the photo (steps of 0.25: 0.5, 0.75, 1, 1.5, 2...). Do not give nutrition for matched ids.
- If nothing in the list fits, set id to null and give: name (Russian), zh (Chinese name if you know it, else ""), portion (short Russian description of what you see, e.g. "порция ~150 г"), qty 1, and kcal, p, c, f (grams) for that portion.
- Judge size from references in the photo: a tray compartment holds about one ladle (~150 g of a dish); a rice bowl holds ~200 g of rice; a fist ≈ 200 g of cooked rice, a palm ≈ 100–120 g of meat, a thumb ≈ 1 tablespoon of oil.
- Canteen dishes are usually oily. If a dish looks glossy or sits in oil, add {"id":"oil","qty":0.5} or {"id":"oil","qty":1}.
- Ignore cutlery, napkins, the tray itself and packaging. If there is no food on the photo, return an empty items array and say so in note.
- confidence is "high", "medium" or "low".
- note: one short sentence in Russian about anything uncertain (what was hidden or hard to judge).

Reply with only JSON in this shape:
{"items":[{"id":"rice","qty":1.5,"confidence":"high"},{"id":null,"name":"Курица с ананасом","zh":"菠萝鸡","portion":"порция ~150 г","qty":1,"kcal":320,"p":20,"c":25,"f":15,"confidence":"medium"}],"note":"..."}`;
}
async function prepImage(file){
  try{
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    return b || file;
  }catch(e){ return file; }
}

const PHOTO_ERR = {
  rate_limited:'Лимит запросов Claude на сейчас исчерпан. Попробуй позже или добавь блюда из списка.',
  image_rejected:'Не получилось прочитать это фото. Сделай другое.',

async function runPhoto(blob){
  const prev = UI.photo;
  if(prev && prev.url && prev.blob !== blob) URL.revokeObjectURL(prev.url);
  const ctl = new AbortController();
  UI.photo = {blob, url:(prev && prev.blob === blob) ? prev.url : URL.createObjectURL(blob), ctl, meal:UI.photoMeal || autoMeal()};
  photoSheet(`<div class="thinking"><span class="spin"></span>Claude смотрит на фото…</div>
    <div class="small muted" style="margin-bottom:14px">Обычно 10–40 секунд. Потом проверишь порции и добавишь.</div>
    <button class="btn btn-block" data-act="photo-stop">Отменить</button>`);
  let res;
  try{
    res = await P.sample.json(photoPrompt(), {images:[blob], signal:ctl.signal});
  }catch(e){
    if(!UI.photo || UI.photo.ctl !== ctl) return;
    const code = e && e.code;
    if(code === 'cancelled'){ const saved = UI.savedAdd; closePhoto(); if(saved) openAdd(null, saved); return; }
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed','images_unavailable'].includes(code)){
      P.photo = false; closePhoto(); openPhotoUnavailable(); return;
    }
    photoSheet(`<div class="note" style="margin-top:14px"><b>Не получилось распознать</b>${esc(PHOTO_ERR[code] || 'Сбой связи с Claude. Попробуй ещё раз.')}</div>
      <div style="display:flex;gap:8px;margin-top:12px"><button class="btn" style="flex:1;height:48px" data-act="photo-new">Другое фото</button>${code === 'rate_limited' ? '' : '<button class="btn btn-accent" style="flex:1;height:48px" data-act="photo-retry">Ещё раз</button>'}</div>`);
    return;
  }
  if(!UI.photo || UI.photo.ctl !== ctl) return;
  const tray = photoToTray(res);
  const note = res && typeof res.note === 'string' ? res.note.slice(0, 300) : '';
  if(!tray.length){
    photoSheet(`<div class="note" style="margin-top:14px"><b>Не вижу еды на фото</b>${esc(note || 'Сфоткай поднос сверху, чтобы было видно все блюда.')}</div>
      <button class="btn btn-accent btn-block" style="margin-top:12px" data-act="photo-new">Сделать другое фото</button>`);
    return;
  }
  const meal = UI.photo.meal, saved = UI.savedAdd;
  closePhoto();
  openAdd(meal, saved);
  for(const t of tray){ const same = UI.add.tray.find(x => x.food.id === t.food.id); if(same) same.qty += t.qty; else UI.add.tray.push(t); }
  UI.add.open = true; UI.add.note = note || 'Порции оценены на глаз — поправь, если взял больше или меньше.';
  renderAddNote(); renderAddList(); renderTray();
}
function photoToTray(res){
  const items = res && Array.isArray(res.items) ? res.items.slice(0, 15) : [];
  const out = [];
  const q4 = v => Math.min(10, Math.max(0.25, Math.round(num(v) * 4) / 4 || 1));
  for(const it of items){
    if(!it || typeof it !== 'object') continue;
    const known = it.id ? foodById(String(it.id)) : null;
    let food;
    if(known) food = known;
    else{
      const kcal = num(it.kcal);
      if(!(kcal > 0) || !it.name) continue;
      food = {id:'ph_' + uid(), name:String(it.name).slice(0, 60), zh:String(it.zh || '').slice(0, 20), portion:String(it.portion || 'порция').slice(0, 40),
        kcal:Math.round(kcal), p:Math.max(0, r1(num(it.p))), c:Math.max(0, r1(num(it.c))), f:Math.max(0, r1(num(it.f)))};
    }
    const qty = q4(it.qty);
    const same = known && out.find(t => t.food.id === known.id);
    if(same) same.qty = Math.min(10, same.qty + qty); else out.push({food, qty});
  }
  return out;
}
const r1 = n => Math.round(n * 10) / 10;
function closePhoto(){
  if(UI.photo && UI.photo.url) URL.revokeObjectURL(UI.photo.url);
  UI.photo = null; closeSheet();
}

    d.water = d.water === i + 1 ? i : i + 1; save(); render();
  },
  'quick-open'(){ openQuick(UI.add ? UI.add.q : UI.foodsQ, false); },
  'quick-meal'(el){ UI.quick.meal = el.dataset.meal; $('#qSeg').innerHTML = mealSeg(UI.quick.meal, 'quick-meal'); },
  'quick-save'(){
    const name = $('#qName').value.trim() || 'Быстрые калории';
    const kcal = num($('#qKcal').value);
    if(kcal <= 0){ $('#qKcal').focus(); toast('Укажи калории'); return; }
    const f = {id:'c_' + uid(), name, zh:'', portion:$('#qPortion').value.trim() || 'порция', kcal, p:num($('#qP').value), c:num($('#qC').value), f:num($('#qF').value)};
    const onlySave = UI.quick.onlySave, keep = onlySave || $('#qSave')?.checked, meal = UI.quick.meal;
    if(keep) S.custom.unshift(f);
    save(); closeSheet();
    if(onlySave){ UI.foodsCat = 'custom'; UI.foodsQ = ''; render(); toast('Блюдо сохранено'); return; }
    const e = makeEntry(f, 1, meal); if(!keep) e.fid = null;
    addEntries([e], `${name} · +${fmt(kcal)} ккал`);
  },
  'foods-cat'(el){ UI.foodsCat = el.dataset.cat; UI.foodsQ = ''; render(); },
  'food-info'(el){
    const f = foodById(el.dataset.fid); if(!f) return;
    UI.tab = 'diary'; render(); openAdd(autoMeal());
    A['tray-add']({dataset:{fid:f.id}});
  },
  'custom-del'(el, ev){
    ev.stopPropagation();
    const id = el.dataset.fid, i = S.custom.findIndex(f => f.id === id); if(i < 0) return;
    const [rm] = S.custom.splice(i, 1); S.fav = S.fav.filter(x => x !== id); S.recent = S.recent.filter(x => x !== id);
    save(); renderFoodsTabList();
    toast(`Удалено: ${rm.name}`, () => { S.custom.splice(i, 0, rm); save(); renderFoodsTabList(); });
  },
  'weight-log'(){
    const kg = num($('#wInput').value);
    if(kg < 30 || kg > 250){ toast('Введи вес в кг, например 73,4'); return; }
    const k = todayKey();
    S.weights = S.weights.filter(w => w.date !== k).concat({date:k, kg:Math.round(kg * 10) / 10}).sort((a, b) => a.date.localeCompare(b.date));
    S.profile.weight = Math.round(kg * 10) / 10;
    save(); render(); toast('Вес записан — норма пересчитана');
  },
  'weight-del'(el){
    S.weights = S.weights.filter(w => w.date !== el.dataset.date);
    if(S.weights.length) S.profile.weight = S.weights[S.weights.length - 1].kg;
    save(); render();
  },
  adapt(el){
    const d = +el.dataset.d, p = S.profile;
    if(p.customKcal) p.customKcal += d; else p.surplus = Math.max(-500, Math.min(1200, p.surplus + d));
    save(); render(); toast(`Новая норма: ${fmt(targets().kcal)} ккал`);
  },
  sex(el){ S.profile.sex = el.dataset.v; save(); render(); },
  async export(){
    const json = JSON.stringify(S, null, 2), filename = `bulking-backup-${todayKey()}.json`;
    if(P.downloads){
      try{ await P.downloads.save({filename, data:json}); toast('Копия сохранена'); }
      catch(e){ if(e && e.code !== 'declined') toast('Не получилось скачать копию'); }
      return;
    }
    const blob = new Blob([json], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  import(){ $('#importFile').click(); },
  reset(el){
    if(!el.dataset.armed){
      el.dataset.armed = '1'; el.textContent = 'Точно удалить всё? Нажми ещё раз';
      setTimeout(() => { if(el.isConnected){ delete el.dataset.armed; el.textContent = 'Сбросить всё'; } }, 4000);
      return;
    }
    S = defaults(); save(); UI.date = todayKey(); render(); toast('Всё сброшено');
  },
  guide: openGuide,
  photo(){
    if(!P.photo) return openPhotoUnavailable();
    if(UI.add) UI.savedAdd = UI.add;
    UI.photoMeal = (UI.savedAdd && UI.savedAdd.meal) || autoMeal();
    $('#photoFile').click();
  },
  'photo-stop'(){ UI.photo && UI.photo.ctl && UI.photo.ctl.abort(); },
  'photo-retry'(){ if(UI.photo) runPhoto(UI.photo.blob); },
  'photo-new'(){ $('#photoFile').click(); },
};

document.addEventListener('click', ev => {
  if(ev.target.matches('[data-backdrop]')) return closeSheet();
  const el = ev.target.closest('[data-act]');
  if(!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if(fn) fn(el, ev);
});
document.addEventListener('keydown', ev => { if(ev.key === 'Escape' && $('#sheetRoot').innerHTML) closeSheet(); });
document.addEventListener('input', ev => {
  const t = ev.target;
  if(t.id === 'addQ'){ UI.add.q = t.value; renderAddCats(); renderAddList(); return; }
  if(t.id === 'foodsQ'){
    UI.foodsQ = t.value;
    $('#foodsCats').querySelectorAll('.chip').forEach(c => c.classList.toggle('on', !t.value && c.dataset.cat === UI.foodsCat));
    renderFoodsTabList(); return;
  }
  const key = t.dataset.pf; if(!key) return;
  const p = S.profile;
  if(key === 'customKcal'){ const v = num(t.value); p.customKcal = v >= 1000 ? v : null; }
  else if(key === 'activity' || key === 'surplus'){ p[key] = +t.value; }
  else { const v = num(t.value); const lim = {age:[10, 100], height:[120, 230], weight:[30, 250], ppk:[0.8, 3.5], fpk:[0.5, 2]}[key]; if(v >= lim[0] && v <= lim[1]) p[key] = v; else return; }
  save(); $('#pfCalc').innerHTML = calcBlock();
});
document.addEventListener('keydown', ev => {
  if(ev.key === 'Enter' && ev.target.id === 'wInput') A['weight-log']();
});
$('#importFile').addEventListener('change', async ev => {
  const file = ev.target.files[0]; ev.target.value = '';
  if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    if(!data || typeof data !== 'object' || !data.profile || !data.days) throw new Error('bad');
    const d = defaults();
    S = {...d, ...data, profile:{...d.profile, ...data.profile}};
    save(); render(); toast('Копия загружена');
  }catch(e){ toast('Это не похоже на файл копии bulking'); }
});

$('#photoFile').addEventListener('change', async ev => {
  const file = ev.target.files[0]; ev.target.value = '';
  if(!file || !P.photo) return;
  const blob = await prepImage(file);
  runPhoto(blob);
});

// day rolls over while the app stays open
let lastToday = todayKey();
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && todayKey() !== lastToday){
    if(UI.date === lastToday) UI.date = todayKey();
    lastToday = todayKey(); if(!UI.add && !UI.edit) render();
  }
});

render();
initPlatform();
if(!P.inClaude && 'serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
</body>
</html>
